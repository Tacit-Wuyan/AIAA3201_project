# Tennis-focused Part 3 route:
# - keep SAM3 for propagation
# - borrow Part 2's small-object strategy: motion-filtered prompt discovery + YOLO-seg fallback
# - focus on the fast tennis ball / racket instead of broad multi-class activity removal

sam3_mask_command: "\"{python_exe}\" \"{project_root}/tools/sam3_auto_mask.py\" --input-video \"{input_video}\" --mask-dir \"{mask_dir}\" --device \"{device}\" --yolo-model \"yolo11n.pt\" --yolo-seg-model \"yolov8n-seg.pt\" --target-classes \"person,sports ball,tennis racket\" --prompt-interval 18 --prompt-filter motion --motion-prompt-topk 3 --motion-score-thresh 1.2 --motion-box-padding 0.02 --max-objs-per-prompt-frame 8 --min-box-area-ratio 0.0006 --max-box-area-ratio 0.75 --nms-iou 0.6 --text-prompt-interval 12 --init-search-sampled-frames 18 --max-prompt-frames-per-class 8 --text-prompt-max-per-class 3 --temporal-window-radius 2 --redetect-interval 12 --min-reprompt-gap 6 --yolo-constraint-padding 0.15 --anomaly-area-ratio-min 0.35 --anomaly-area-ratio-max 2.8 --anomaly-center-jump-factor 1.6 --text-guidance-match-ratio-min 0.60 --text-guidance-mean-iou-min 0.35 --text-guidance-small-area-max 0.01 --text-guidance-slenderness-max 4.5 --small-object-box-classes \"sports ball\" --small-object-box-padding 1.0 --small-object-track-window 12 --mask-dilate 0 --mask-close 3 --min-mask-area 80 --yolo-fallback --fallback-min-area 80 --force-yolo-fallback-classes \"sports ball\" --force-yolo-box-fallback-classes \"sports ball\" --force-yolo-fallback-min-propagated 1 --force-yolo-box-padding 0.30 --propagation-direction both --offload-video-to-cpu"

propainter_inpaint_command: "\"{python_exe}\" \"{project_root}/tools/part3_sam3_propainter_adapter.py\" --input-video \"{input_video}\" --mask-dir \"{mask_dir}\" --inpaint-dir \"{inpaint_dir}\" --output-dir \"{output_dir}\" --inpaint-video \"{inpaint_video}\" --device \"{device}\""
