sam3_mask_command: "\"{python_exe}\" \"{project_root}/tools/sam3_auto_mask.py\" --input-video \"{input_video}\" --mask-dir \"{mask_dir}\" --device \"{device}\" --yolo-model \"yolo11n.pt\" --target-classes \"person,bicycle,sports ball,tennis racket\" --prompt-interval 18 --max-prompt-frames-per-class 18 --max-objs-per-prompt-frame 2 --min-box-area-ratio 0.0006 --max-box-area-ratio 0.75 --nms-iou 0.6 --mask-dilate 0 --mask-close 3 --mask-open 0 --min-mask-area 80 --yolo-fallback --fallback-min-area 80 --propagation-direction both --offload-video-to-cpu"

diffueraser_inpaint_command: "\"{python_exe}\" \"{project_root}/tools/diffueraser_adapter.py\" --input-video \"{input_video}\" --mask-dir \"{mask_dir}\" --inpaint-dir \"{inpaint_dir}\" --output-dir \"{output_dir}\" --inpaint-video \"{inpaint_video}\" --device \"{device}\" --max-img-size 960 --mask-dilation-iter 8 --ref-stride 10 --neighbor-length 10 --subvideo-length 50"
